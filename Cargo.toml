[package]
name = "homesoil"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "io-util"] }
dotenv = "0.15.0"
serde_json = "1.0.108"
serde = { version = "1.0.193", features = ["derive"] }
futures-util = "0.3.29"
coap-lite = "0.11.3"
socketioxide = { version = "0.8.0", features = ["state"] }
futures = "0.3.29"
log = "0.4.20"
env_logger = "0.11"
tokio-stream = "0.1.14"
lru_time_cache = "0.11.11"
url = "2.5.0"
regex = "1.10.2"
tokio-util = { version = "0.7.10", features = ["codec", "net"] }
bytes = "1.5.0"
axum = "0.6.20"
axum-server = { version = "0.5", features = ["tls-rustls"] }
axum-util = "0.2.2"
chrono = "0.4.31"
diesel = { version = "2.1.4", features = ["chrono", "sqlite", "r2d2"] }
local-ip-address = "0.5.6"
rand = "0.8.5"
openssl = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
